<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survey</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
  <div id="surveyContainer" class="w-full max-w-lg p-6 bg-white rounded-lg shadow-lg">
    <div id="questionContainer" class="text-center">
      <!-- Questions will be injected here dynamically -->
    </div>
    <div id="navigationContainer" class="mt-6 flex justify-between">
      <button id="prevButton" class="hidden bg-gray-300 text-gray-700 py-2 px-4 rounded-lg hover:bg-gray-400">Previous</button>
      <button id="nextButton" class="bg-blue-500 text-white py-2 px-4 rounded-lg hover:bg-blue-600">Next</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
