<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">

    <!-- Large Question Box -->
    <div class="w-1/2 max-h-auto p-4 bg-gray-200 rounded-lg mb-6 absolute top-10">
        <h2 id="question-text" class="text-xl font-bold text-center text-gray-800">{{ question }}</h2>
    </div>

    <div class="w-full max-w-lg p-6 bg-white rounded-lg shadow-lg">
        
        <form id="survey-form" method="POST">
            <!-- Answer Input -->
            <input type="text" id="answer" name="answer" class="w-full border rounded-lg p-3 text-lg" placeholder="Type your answer here...">

            <!-- Inside the <form id="survey-form"> -->
            <input type="hidden" id="bypass" name="bypass" value="false">

            <!-- Hide text checkbox -->
            <label class="flex items-center mt-3 cursor-pointer">
                <input type="checkbox" id="toggle-hide" class="mr-2">
                <span class="text-gray-700">Hide text</span>
            </label>
            
            <!-- Buttons -->
            <div class="mt-6 flex justify-between">
                <button data-tooltip-target="tooltip" type="submit" name="skip_next" class="w-1/2 bg-gray-500 text-white py-2 px-4 rounded-lg hover:bg-gray-600 mr-2">
                    Skip Question
                </button>
                <button data-tooltip-target="tooltip" type="submit" name="next" class="w-1/2 bg-blue-500 text-white py-2 px-4 rounded-lg hover:bg-blue-600">
                    Next
                </button>
                <div id="generic-tooltip" data-tooltip="tooltip" role="tooltip" class="absolute z-10 invisible inline-block px-3 py-2 text-sm font-medium text-white transition-opacity duration-300 bg-gray-900 rounded-lg shadow-xs opacity-0 tooltip dark:bg-gray-700">
                    Return
                    <div class="tooltip-arrow" data-popper-arrow></div>
                </div>
            </div>
            <!-- New "Skip to End" Button -->
            <div class="mt-4">
                <button type="submit" name="skip_all" 
                        onclick="return confirm('Are you sure you want to skip all remaining questions and go directly to the results?');"
                        class="w-full bg-red-500 text-white py-2 px-4 rounded-lg hover:bg-red-600">
                Skip all remaining questions
                </button>
            </div>

            <!-- Bypass Button Container -->
            <div id="bypass-container" class="hidden mt-4 text-center">
                <button type="button" id="bypass-button" 
                        class="bg-green-500 text-white py-2 px-4 rounded-lg hover:bg-green-600">
                    I answered correctly. Go to the next question.
                </button>
            </div>
        </form>

        <!-- Loading Indicator -->
        <div id="loading" class="hidden flex items-center justify-center space-x-2 mt-4">
            <div class="w-3 h-3 bg-blue-500 rounded-full animate-ping"></div>
            <div class="w-3 h-3 bg-blue-500 rounded-full animate-ping delay-200"></div>
            <div class="w-3 h-3 bg-blue-500 rounded-full animate-ping delay-400"></div>
        </div>

    </div>

    <div class="bg-teal-100 border-t-4 border-teal-500 rounded-b text-teal-900 px-4 py-3 shadow-md fixed bottom-10" role="alert">
        <div class="flex">
          <div class="py-1 bottom-20"><svg class="fill-current h-6 w-6 text-teal-500 mr-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M2.93 17.07A10 10 0 1 1 17.07 2.93 10 10 0 0 1 2.93 17.07zm12.73-1.41A8 8 0 1 0 4.34 4.34a8 8 0 0 0 11.32 11.32zM9 11V9h2v6H9v-4zm0-6h2v2H9V5z"/></svg></div>
          <div>
            <p class="font-bold">Your data is secure</p>
            <p class="text-sm">Our survey uses encryption to ensure that all of your personal data is stored securely.</p>
          </div>
        </div>
    </div>

    <script>
        // Global counter for header resets
        let headerResetCount = 0;

        document.getElementById("survey-form").addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
                event.preventDefault();
            }
        });

        // Toggle password visibility
        document.getElementById("toggle-hide").addEventListener("change", function() {
            let answerField = document.getElementById("answer");
            answerField.type = this.checked ? "password" : "text";
        });

        // Handle form submission
        document.getElementById("survey-form").addEventListener("submit", async function(event) {
            event.preventDefault();  // Prevent default submission

            let formData = new FormData(this);

            // Detect which button was clicked
            let submitButton = document.activeElement;  
            console.log(event.submitter);
            // Detect which button was clicked using event.submitter
            if (event.submitter && event.submitter.name === "skip_next") {
                formData.append("skip_next", "true");  // Mark as skipped for this question
            } else if (event.submitter && event.submitter.name === "skip_all") {
                formData.append("skip_all", "true");   // Mark that the user wants to skip to the end
            }


            document.getElementById("loading").classList.remove("hidden");
            
            let answer = document.getElementById("answer").value;
            let questionId = "{{ question_id }}";

            let response = await fetch("{{ url_for('survey', question_id=question_id) }}", {
                method: "POST",
                body: formData,
                headers: { "X-Requested-With": "XMLHttpRequest" }
            });

            let contentType = response.headers.get("Content-Type");

            if (contentType && contentType.includes("application/json")) {
                let data = await response.json();

                if (data.new_prompt) {
                    document.getElementById("loading").classList.add("hidden");

                    let header = document.getElementById('question-text');
                    header.textContent = '';
                    headerResetCount++;
                    if (headerResetCount >= 2) {
                        document.getElementById("bypass-container").classList.remove("hidden");
                    }
                    if (data.ai_ver) {
                        showTypingEffect(header, data.new_prompt);
                    } else {
                        header.textContent = data.new_prompt;
                    }
                } else if (data.next_url) {
                    // Leave the loading spinner visible while navigating
                    window.location.href = data.next_url;
                } else {
                    // Fallback in case next_url is not present
                    window.location.href = this.action;
                }
            }
        });

        (function() {
        history.pushState(null, null, location.href);
        window.onpopstate = function(event) {
            history.pushState(null, null, location.href);
        };
        })();

        function showTypingEffect(element, text) {
            element.innerHTML = "";
            headerResetCount++;

            let index = 0;
            function type() {
                if (index < text.length) {
                    element.innerHTML += text.charAt(index);
                    index++;
                    setTimeout(type, 20);
                }
            }
            type();
        }

        // Attach event listener to the bypass button
        document.getElementById("bypass-button").addEventListener("click", function() {
            // Reset the header counter for the next question
            headerResetCount = 0;

            // Set the bypass flag so the backend logs it
            document.getElementById("bypass").value = "true";

            // Hide the bypass container again
            document.getElementById("bypass-container").classList.add("hidden");

            // Submit the form (which will go to the next question properly)
            document.getElementById("survey-form").requestSubmit();
        });

    </script>
</body>
</html>
