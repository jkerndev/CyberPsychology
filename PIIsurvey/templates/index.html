<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the Survey</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="w-full max-w-md p-6 bg-white rounded-lg shadow-lg">
        <h1 class="text-xl font-bold text-center mb-6">{{ theme }}</h1>
        {% if subtheme is not none %}
        <p class="text-center text-gray-600">{{ subtheme }}</p>
        {% endif %}
        <a href="{{ url_for('register') }}" class="block text-center mt-6 bg-blue-500 text-white py-2 px-4 rounded-lg hover:bg-blue-600">Start Survey</a>
    </div>
</body>
</html>
